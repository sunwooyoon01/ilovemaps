<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>maps heaven</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#000}
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:Helvetica,"Helvetica Neue",Arial,sans-serif;text-transform:lowercase;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px 28px}
header{width:100%;max-width:900px;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:10px;margin-bottom:14px}
h1{font-size:1.1rem;font-weight:700;letter-spacing:.02em;margin:0}
.filters{display:flex;gap:8px;flex-wrap:wrap}
select{font:inherit;font-size:.85rem;text-transform:lowercase;background:#000;color:#fff;border:1px solid #fff;border-radius:0;padding:6px 8px}
select option{text-transform:lowercase;background:#000;color:#fff}
figure{margin:0;width:100%;max-width:900px;background:#000;border:1px solid #fff;padding:clamp(10px,2.5vw,18px);transition:opacity .35s}
figure.fade{opacity:.25}
#frame{display:flex;justify-content:center;align-items:center;min-height:240px}
#frame img{display:block;max-width:100%;max-height:72vh;object-fit:contain}
#status{color:#999;padding:40px 10px;text-align:center;font-size:.9rem}
figcaption{color:#fff;padding:16px 2px 2px;max-width:72ch}
h2{font-size:1.05rem;font-weight:700;margin:0 0 6px}
#meta{margin:0 0 8px;font-size:.95rem;line-height:1.45}
#src{margin:0;font-size:.8rem;color:#999}
#src a{color:inherit}
nav{display:flex;gap:12px;margin-top:18px}
button{font:inherit;font-size:.9rem;text-transform:lowercase;background:#000;color:#fff;border:1px solid #fff;border-radius:0;padding:9px 20px;cursor:pointer}
button.main{background:#fff;color:#000}
button:hover:not(:disabled){text-decoration:underline}
button:focus-visible,select:focus-visible{outline:2px solid #fff;outline-offset:3px}
button:disabled{opacity:.35;cursor:default}
#trace{position:relative;width:100%;max-width:900px;height:52px;margin-top:22px;overflow:hidden}
.th{position:absolute;left:0;top:0;padding:0;border:1px solid #fff;background:#000;cursor:pointer;overflow:hidden;transition:transform .55s ease,opacity .55s ease}
.th img{display:block;width:100%;height:100%;object-fit:cover}
@media (prefers-reduced-motion:reduce){figure{transition:none}.th{transition:none}}
</style>
</head>
<body>
<header>
 <h1>maps heaven</h1>
 <div class="filters">
  <select id="topic" aria-label="subject">
   <option value="random">random subject</option><option value="maps">maps</option><option value="stars">star charts</option><option value="plans">city plans</option><option value="charts">sea charts</option><option value="science">scientific diagrams</option><option value="nature">natural history plates</option><option value="mnemonic">mnemonic diagrams</option>
  </select>
  <select id="era" aria-label="era">
   <option value="">any era</option><option value="1500/1699">1500s–1600s</option><option value="1700/1799">1700s</option><option value="1800/1899">1800s</option><option value="1900/1950">1900–1950</option>
  </select>
 </div>
</header>
<figure id="fig">
 <div id="frame"><div id="status">finding a plate…</div></div>
 <figcaption><h2 id="t"></h2><p id="meta"></p><p id="src"></p></figcaption>
</figure>
<nav><button id="back" disabled>previous plate</button><button id="next" class="main">next plate</button></nav>
<div id="trace" aria-label="recently seen plates"></div>

<script>
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[rnd(0,a.length-1)];
const TOPICS={
 maps:{loc:['map','atlas','topographical map','province map','world map'],wm:['old map','historical map','antique map']},
 stars:{loc:['celestial chart','star chart','constellations'],wm:['celestial map','star chart','constellation atlas']},
 plans:{loc:['city plan','plan of the city','bird\'s-eye view'],wm:['old city plan','historic city map','town plan']},
 charts:{loc:['nautical chart','chart of the coast','harbor chart'],wm:['nautical chart','sea chart','portolan']},
 science:{wm:['scientific diagram','astronomical diagram','cosmological diagram','geometric diagram','physics illustration','chart of the elements']},
 nature:{wm:['anatomical plate','botanical plate','natural history plate','zoological illustration','kunstformen der natur','scientific illustration']},
 mnemonic:{wm:['mnemonic diagram','memory palace','ars memorativa','tree of knowledge','mnemonic chart','diagram of the sciences','tree of porphyry']}
};
const clean=s=>(s||'').replace(/<[^>]*>/g,'').replace(/&amp;/g,'&').replace(/\s+/g,' ').replace(/[\s\/:;,.]+$/,'').trim();
const first=v=>Array.isArray(v)?v[0]:v;
async function getJSON(url,ms=9000){
 const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);
 try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}
 finally{clearTimeout(t)}
}

async function fromLoC(topic,era){
 const q=pick(TOPICS[topic].loc);
 const url=`https://www.loc.gov/maps/?q=${encodeURIComponent(q)}${era?'&dates='+era:''}&fo=json&c=25&sp=${rnd(1,30)}&at=results`;
 const j=await getJSON(url);
 const items=(j.results||[]).filter(r=>r.image_url&&r.image_url.length&&r.title);
 if(!items.length)throw new Error('loc empty');
 const r=pick(items),imgs=r.image_url;
 const sized=imgs.map(u=>({u,w:+((u.match(/[#&]w=(\d+)/)||[])[1]||0)}));
 const ok=sized.filter(x=>x.w>=800).sort((a,b)=>a.w-b.w)[0];
 const img=(ok||sized[sized.length-1]).u;
 const c=first(r.contributor)||first(r.contributor_names)||'';
 return{img,title:clean(r.title),by:clean(c).replace(/\b\w/g,m=>m.toUpperCase()),date:clean(r.date||''),
  source:'Library of Congress',link:r.url||r.id,rights:'digitized item; see source page for rights'};
}

async function fromCommons(topic,era){
 const [y0,y1]=era?era.split('/').map(Number):[0,0];
 const yr=era?' '+rnd(y0,y1):'';
 const term=pick(TOPICS[topic].wm)+yr;
 const url='https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=20&gsroffset='+rnd(0,120)+'&gsrsearch='+encodeURIComponent(term+' filetype:bitmap')+'&prop=imageinfo&iiprop=url|extmetadata|size&iiurlwidth=1400';
 const j=await getJSON(url);
 const pages=Object.values((j.query&&j.query.pages)||{}).filter(p=>p.imageinfo&&p.imageinfo[0].thumburl&&p.imageinfo[0].width>600);
 if(!pages.length)throw new Error('wm empty');
 const p=pick(pages),ii=p.imageinfo[0],m=ii.extmetadata||{},v=k=>clean(m[k]&&m[k].value);
 return{img:ii.thumburl,title:v('ObjectName')||clean(p.title.replace(/^File:|\.\w+$/g,'')),by:v('Artist'),date:v('DateTimeOriginal'),
  source:'Wikimedia Commons',link:ii.descriptionurl,rights:v('LicenseShortName')};
}

const loadImg=src=>new Promise((res,rej)=>{const i=new Image(),t=setTimeout(()=>rej(new Error('image timed out')),15000);i.alt='';i.onload=()=>{clearTimeout(t);res(i)};i.onerror=()=>{clearTimeout(t);rej(new Error('image failed to load'))};i.src=src});
const LABEL={maps:'map',stars:'star chart',plans:'city plan',charts:'sea chart',science:'scientific diagram',nature:'natural history plate',mnemonic:'mnemonic diagram'};
async function fetchPlate(){
 const sel=$('topic').value,era=$('era').value,errs=[];
 for(let n=0;n<6;n++){
  const tp=sel==='random'?pick(Object.keys(TOPICS)):sel;
  let srcs=[['library of congress',fromLoC],['wikimedia commons',fromCommons]];
  if(!TOPICS[tp].loc)srcs=[srcs[1]];
  const [name,f]=pick(srcs);
  try{const p=await f(tp,era);p.kind=tp;p.el=await loadImg(p.img);return p}
  catch(e){errs.push(name+': '+(e.name==='AbortError'?'request timed out':e.message))}
 }
 const err=new Error('none');err.detail=[...new Set(errs)];throw err;
}

let hist=[],pos=-1,busy=false;
const tr=$('trace'),thumbs=new Map(),SLOTS=6;
const seen=()=>hist.slice(Math.max(0,pos-SLOTS),pos);
function updateTrace(){
 const prev=seen(),step=Math.min(80,(tr.clientWidth||480)/SLOTS),tw=step-8,th=Math.round(tw*.72);
 tr.style.height=th+'px';
 const place=(el,x,o)=>{el.style.transform='translateX('+x+'px)';el.style.opacity=o};
 prev.forEach((p,i)=>{
  const age=prev.length-1-i;
  let el=thumbs.get(p);
  if(!el){
   el=document.createElement('button');el.className='th';el.title=p.title;el.setAttribute('aria-label','revisit: '+p.title);
   const im=document.createElement('img');im.src=p.img;im.alt='';el.append(im);
   el.onclick=()=>{pos=hist.indexOf(p);render(p)};
   el.style.width=tw+'px';el.style.height=th+'px';
   place(el,SLOTS*step,0);tr.append(el);thumbs.set(p,el);el.getBoundingClientRect();
  }
  el.style.width=tw+'px';el.style.height=th+'px';
  place(el,(SLOTS-1-age)*step,Math.max(.12,.9-age*.15));
 });
 thumbs.forEach((el,p)=>{
  if(!prev.includes(p)){place(el,-step,0);setTimeout(()=>{if(!seen().includes(p)){el.remove();thumbs.delete(p)}},700)}
 });
}
addEventListener('resize',updateTrace);
function render(p){
 const fr=$('frame');fr.replaceChildren(p.el);p.el.alt=p.title;
 $('t').textContent=p.title;
 $('meta').textContent=[p.by,p.date].filter(Boolean).join(', ');
 const s=$('src');s.replaceChildren(document.createTextNode('source: '));
 const a=document.createElement('a');a.href=p.link;a.target='_blank';a.rel='noopener';a.textContent=p.source;s.append(a);
 s.append(document.createTextNode(' · '+LABEL[p.kind]+(p.rights?' · '+p.rights:'')));
 $('back').disabled=pos<=0;
 updateTrace();
}
async function go(dir){
 if(busy)return;
 if(dir<0){if(pos>0){pos--;render(hist[pos])}return}
 if(pos<hist.length-1){pos++;render(hist[pos]);return}
 busy=true;$('fig').classList.add('fade');$('next').disabled=true;
 try{const p=await fetchPlate();hist.push(p);pos=hist.length-1;render(p)}
 catch(e){const d=document.createElement('div');d.id='status';d.textContent="couldn't load a plate. "+(e.detail||[e.message]).join(' | ');$('frame').replaceChildren(d)}
 busy=false;$('fig').classList.remove('fade');$('next').disabled=false;
}
$('next').onclick=()=>go(1);$('back').onclick=()=>go(-1);
['topic','era'].forEach(id=>$(id).onchange=()=>{hist=[];pos=-1;updateTrace();go(1)});
addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(1)}if(e.key==='ArrowLeft')go(-1)});
go(1);
</script>
</body>
</html>
