<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>maps heaven</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#000}
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:Helvetica,"Helvetica Neue",Arial,sans-serif;text-transform:lowercase;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px 28px}
header{width:100%;max-width:900px;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:10px;margin-bottom:14px}
h1{font-size:1.1rem;font-weight:700;letter-spacing:.02em;margin:0}
.filters{display:flex;gap:8px;flex-wrap:wrap}
select{font:inherit;font-size:.85rem;text-transform:lowercase;background:#000;color:#fff;border:1px solid #fff;border-radius:0;padding:6px 8px}
select option{text-transform:lowercase;background:#000;color:#fff}
figure{margin:0;width:100%;max-width:900px;background:#000;border:1px solid #fff;padding:clamp(10px,2.5vw,18px);transition:opacity .35s}
figure.fade{opacity:.25}
#frame{display:flex;justify-content:center;align-items:center;min-height:240px}
#frame img{display:block;max-width:100%;max-height:72vh;object-fit:contain}
#status{color:#999;padding:40px 10px;text-align:center;font-size:.9rem}
figcaption{color:#fff;padding:16px 2px 2px;max-width:72ch}
h2{font-size:1.05rem;font-weight:700;margin:0 0 6px}
#meta{margin:0 0 8px;font-size:.95rem;line-height:1.45}
#src{margin:0;font-size:.8rem;color:#999}
#src a{color:inherit}
nav{display:flex;gap:12px;margin-top:18px}
button{font:inherit;font-size:.9rem;text-transform:lowercase;background:#000;color:#fff;border:1px solid #fff;border-radius:0;padding:9px 20px;cursor:pointer}
button.main{background:#fff;color:#000}
button:hover:not(:disabled){text-decoration:underline}
button:focus-visible,select:focus-visible{outline:2px solid #fff;outline-offset:3px}
button:disabled{opacity:.35;cursor:default}
#trace{position:relative;width:100%;max-width:900px;height:52px;margin-top:22px;overflow:hidden}
.th{position:absolute;left:0;top:0;padding:0;border:1px solid #fff;background:#000;cursor:pointer;overflow:hidden;transition:transform .55s ease,opacity .55s ease}
.th img{display:block;width:100%;height:100%;object-fit:cover}
@media (prefers-reduced-motion:reduce){figure{transition:none}.th{transition:none}}
</style>
</head>
<body>
<header>
 <h1>maps heaven</h1>
 <div class="filters">
  <select id="topic" aria-label="subject">
   <option value="random">random subject</option><option value="maps">maps</option><option value="stars">star charts</option><option value="plans">city plans</option><option value="charts">sea charts</option><option value="science">scientific diagrams</option><option value="nature">natural history plates</option><option value="animals">animals</option>
  </select>
  <select id="era" aria-label="era">
   <option value="">any era</option><option value="1500/1699">1500s–1600s</option><option value="1700/1799">1700s</option><option value="1800/1899">1800s</option><option value="1900/1950">1900–1950</option>
  </select>
 </div>
</header>
<figure id="fig">
 <div id="frame"><div id="status">finding a plate…</div></div>
 <figcaption><h2 id="t"></h2><p id="meta"></p><p id="src"></p></figcaption>
</figure>
<nav><button id="back" disabled>previous plate</button><button id="next" class="main">next plate</button></nav>
<div id="trace" aria-label="recently seen plates"></div>

<script>
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[rnd(0,a.length-1)];
const TOPICS={
 maps:{loc:['map','atlas','topographical map','province map','world map'],wm:['old map','historical map','antique map','atlas map','engraved map'],re:/map|atlas|plan|chart|carte|karte|mappa|cartograph/i},
 stars:{loc:['celestial chart','star chart','constellations'],wm:['celestial map','star chart','constellation atlas','planisphere','uranometria'],met:['celestial','astronomy','constellation'],re:/celestial|star|constellation|planisphere|astronom|zodiac|uranometria|sky|himmel/i},
 plans:{loc:['city plan','plan of the city',"bird's-eye view"],wm:['old city plan','historic city map','town plan','panoramic view city map'],re:/plan|map|view|vue|panorama|karte|pianta|bird/i},
 charts:{loc:['nautical chart','chart of the coast','harbor chart'],wm:['nautical chart','sea chart','portolan','coast chart'],re:/chart|portolan|nautical|coast|harbo|sea|carta|maritime/i},
 science:{wm:['scientific diagram','astronomical diagram','cosmological diagram','geometric diagram','physics illustration','chart of the elements','mnemonic diagram','memory palace','tree of knowledge','ars memorativa','diagram of the sciences'],met:['astronomy','geometry','anatomy diagram'],re:/diagram|astronom|cosmolog|geometr|physic|chemi|element|optic|scheme|figure|illustration|plate|machine|engineering|mnemonic|memor|tree|knowledge|wheel/i},
 nature:{wm:['anatomical plate','botanical plate','natural history plate','zoological illustration','kunstformen der natur','scientific illustration'],met:['botanical','natural history','anatomy'],re:/plate|illustration|anatom|botan|zoolog|natural|flora|fauna|specimen|kunstformen|tafel|drawing|engraving/i},
 animals:{loc:['zoo','menagerie','circus animals','horses','dogs','birds','elephant'],locp:'photos',wm:['historical zoo photograph','menagerie engraving','taxidermy museum specimen','vintage animal photograph','circus animal poster','natural history animal illustration','newspaper clipping animal','museum zoological collection historic'],met:['animal','dog','horse','bird','lion','fish','elephant','insect'],re:/animal|zoo|menagerie|bird|fish|dog|cat|horse|cattle|elephant|lion|tiger|monkey|ape|insect|specimen|taxiderm|fauna|natural history|circus|beast|livestock|wildlife|cow|sheep|pig/i}
};
const LABEL={maps:'map',stars:'star chart',plans:'city plan',charts:'sea chart',science:'scientific diagram',nature:'natural history plate',animals:'animals'};
const BAD=/\b(logo|icon|screenshot|banner|flag of|coat of arms|banknote|stamp|signature|userbox)\b/i;
const clean=s=>(s||'').replace(/<[^>]*>/g,'').replace(/&amp;/g,'&').replace(/\s+/g,' ').replace(/[\s\/:;,.]+$/,'').trim();
const first=v=>Array.isArray(v)?v[0]:v;
async function getJSON(url,ms=9000){
 const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);
 try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw new Error('HTTP '+r.status+' from '+new URL(url).hostname);return await r.json()}
 finally{clearTimeout(t)}
}

/* --- keeping results fresh and varied --- */
let seenIds=new Set();try{seenIds=new Set(JSON.parse(localStorage.getItem('mh_seen')||'[]'))}catch(e){}
const recent=[];
const STOP=new Set(['the','and','map','maps','chart','plan','plate','file','with','from','view','new','old','atlas','diagram','della','von','del','der']);
const tok=t=>new Set((t||'').toLowerCase().split(/\W+/).filter(w=>w.length>3&&!STOP.has(w)&&!/^\d+$/.test(w)));
const who=b=>{b=(b||'').toLowerCase().trim();return/unknown|anonym|^$/.test(b)?'':b.slice(0,30)};
function similar(p,r){
 const by=who(p.by);if(by&&by===r.by)return true;
 const a=tok(p.title);let n=0;a.forEach(w=>{if(r.tok.has(w))n++});
 return n>=2&&n>=.6*Math.min(a.size,r.tok.size);
}
function yearOK(p,era){
 if(!era)return true;
 const [a,b]=era.split('/').map(Number),ys=(String(p.date||'').match(/\b(1[3-9]\d\d|20[0-2]\d)\b/g)||[]).map(Number);
 return !ys.length||ys.some(y=>y>=a&&y<=b);
}
function choose(c,era){
 const good=c.filter(p=>!seenIds.has(p.id)&&yearOK(p,era)&&!recent.some(r=>similar(p,r)));
 if(!good.length)throw new Error('no fresh match');
 return pick(good);
}
function markSeen(p){
 seenIds.add(p.id);recent.push({by:who(p.by),tok:tok(p.title)});if(recent.length>8)recent.shift();
 try{localStorage.setItem('mh_seen',JSON.stringify([...seenIds].slice(-800)))}catch(e){}
}

/* --- sources --- */
const PROXY=''; // paste your cloudflare worker url here to switch on smithsonian + bhl
const API=PROXY.trim().replace(/\/+$/,'');
const SIQ={maps:['map','atlas'],stars:['celestial chart','star chart'],charts:['nautical chart'],plans:['city plan'],science:['scientific diagram','astronomical chart','scientific illustration','mnemonic diagram'],nature:['botanical illustration','natural history illustration','anatomical illustration'],animals:['animal photograph','taxidermy specimen','zoo photograph','bird illustration','animal print']};
const BHLQ={maps:['atlas maps'],stars:['astronomy atlas'],science:['anatomy plates','astronomy diagrams','physics plates'],nature:['botanical plates','natural history plates','fishes plates'],animals:['birds plates','mammals plates','insects plates','animals illustrations']};
async function fromSI(tp,era){
 const q=pick(SIQ[tp])+' AND online_media_type:"Images"';
 const j=await getJSON(API+'/si?q='+encodeURIComponent(q)+'&rows=40&start='+rnd(0,200)+'&sort=random');
 const c=((j.response&&j.response.rows)||[]).map(r=>{
  const d=r.content||{},dn=d.descriptiveNonRepeating||{},fr=d.freetext||{};
  const m=((dn.online_media||{}).media||[]).find(x=>/image/i.test(x.type||'')&&(!x.usage||x.usage.access==='CC0'));
  if(!m)return null;
  const img=m.content+(/ids\.si\.edu/.test(m.content)?(m.content.includes('?')?'&':'?')+'max_w=1400':'');
  return{id:'si:'+r.id,img,title:clean((dn.title&&dn.title.content)||r.title),by:clean(((fr.name||[])[0]||{}).content),date:clean(((fr.date||[])[0]||{}).content),source:'smithsonian',link:dn.record_link,rights:'cc0 · '+clean(dn.data_source)};
 }).filter(Boolean);
 return choose(c,era);
}
async function fromBHL(tp,era){
 const b=op=>API+'/bhl?op='+op;
 const sr=await getJSON(b('PublicationSearch')+'&searchterm='+encodeURIComponent(pick(BHLQ[tp]))+'&searchtype=C&page='+rnd(1,5));
 const hits=(sr.Result||[]).filter(r=>r.ItemID);
 if(!hits.length)throw new Error('no results');
 const it=pick(hits);
 const m=await getJSON(b('GetItemMetadata')+'&id='+it.ItemID+'&pages=t&ocr=f&parts=f',15000);
 let R=m.Result;if(Array.isArray(R))R=R[0];R=R||{};
 const pages=(R.Pages||[]).filter(p=>(p.PageTypes||[]).some(t=>/illustration|plate|map|chart|diagram|table/i.test(t.PageTypeName||'')));
 if(!pages.length)throw new Error('no illustrated pages');
 const c=pages.sort(()=>Math.random()-.5).slice(0,12).map(p=>({id:'bhl:'+p.PageID,img:'https://www.biodiversitylibrary.org/pageimage/'+p.PageID,
  title:clean(R.ShortTitle||R.Title||it.Title||'')+(p.PageNumbers&&p.PageNumbers[0]&&p.PageNumbers[0].Number?', p. '+p.PageNumbers[0].Number:''),
  by:clean(((R.Authors||it.Authors||[])[0]||{}).Name||''),date:clean(String(R.Year||R.StartYear||it.PublicationDate||'')),
  source:'biodiversity heritage library',link:'https://www.biodiversitylibrary.org/page/'+p.PageID,rights:'see source page for rights'}));
 return choose(c,era);
}
async function fromLoC(tp,era){
 const t=TOPICS[tp],q=encodeURIComponent(pick(t.loc));
 const u=d=>`https://www.loc.gov/${t.locp||'maps'}/?q=${q}${d?'&dates='+d:''}&fo=json&c=25&sp=${rnd(1,30)}&at=results`;
 let j=await getJSON(u(era));
 if(!(j.results||[]).length&&era)j=await getJSON(u(''));
 const c=(j.results||[]).filter(r=>r.image_url&&r.image_url.length&&r.title).map(r=>{
  const sized=r.image_url.map(x=>({u:x,w:+((x.match(/[#&]w=(\d+)/)||[])[1]||0)}));
  const ok=sized.filter(x=>x.w>=800).sort((a,b)=>a.w-b.w)[0];
  const by=clean(first(r.contributor)||first(r.contributor_names)||'').replace(/\b\w/g,m=>m.toUpperCase());
  return{id:'loc:'+(r.id||r.url),img:(ok||sized[sized.length-1]).u,title:clean(r.title),by,date:clean(r.date||''),source:'library of congress',link:r.url||r.id,rights:'digitized item; see source page for rights'};
 });
 return choose(c,era);
}
async function fromCommons(tp,era){
 const t=TOPICS[tp],[y0,y1]=era?era.split('/').map(Number):[0,0];
 const term=pick(t.wm)+(era&&Math.random()<.5?' '+rnd(y0,y1):'');
 const base='https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=50&gsrsearch='+encodeURIComponent(term+' filetype:bitmap')+'&prop=imageinfo|categories&iiprop=url|extmetadata|size&iiurlwidth=1400&clshow=!hidden&cllimit=max';
 let j=await getJSON(base+'&gsrsort=random');
 if(j.error)j=await getJSON(base+'&gsroffset='+rnd(0,250));
 const c=Object.values((j.query&&j.query.pages)||{}).filter(p=>p.imageinfo&&p.imageinfo[0].thumburl&&p.imageinfo[0].width>600).map(p=>{
  const ii=p.imageinfo[0],m=ii.extmetadata||{},v=k=>clean(m[k]&&m[k].value);
  const title=v('ObjectName')||clean(p.title.replace(/^File:|\.\w+$/g,''));
  return{id:'wm:'+p.title,img:ii.thumburl,title,by:v('Artist'),date:v('DateTimeOriginal'),source:'wikimedia commons',link:ii.descriptionurl,rights:v('LicenseShortName'),
   _txt:title+' '+(p.categories||[]).map(x=>x.title).join(' ')+' '+v('ImageDescription')};
 }).filter(p=>t.re.test(p._txt)&&!BAD.test(p._txt));
 return choose(c,era);
}
const MET='https://collectionapi.metmuseum.org/public/collection/v1/',MET11='https://collectionapi.metmuseum.org/public/collection/v1.1/';
async function fromMet(tp,era){
 const t=TOPICS[tp],[y0,y1]=era?era.split('/').map(Number):[0,0];
 const qs='search?hasImages=true&isPublicDomain=true&limit=100&q='+encodeURIComponent(pick(t.met))+(era?'&dateBegin='+y0+'&dateEnd='+y1:'');
 let j=await getJSON(MET11+qs+'&offset='+rnd(0,200));
 if(!(j.objectIDs||[]).length)j=await getJSON(MET11+qs);
 const ids=(j.objectIDs||[]).sort(()=>Math.random()-.5).slice(0,10);
 if(!ids.length)throw new Error('no results');
 const objs=await Promise.all(ids.map(id=>getJSON(MET+'objects/'+id).catch(()=>null)));
 const c=objs.filter(o=>o&&o.primaryImage).map(o=>({id:'met:'+o.objectID,img:o.primaryImage,title:clean(o.title),by:clean(o.artistDisplayName),date:clean(o.objectDate),source:'the met museum',link:o.objectURL,rights:'public domain'}));
 return choose(c,era);
}

const loadImg=src=>new Promise((res,rej)=>{const i=new Image(),t=setTimeout(()=>rej(new Error('image timed out')),15000);i.alt='';i.onload=()=>{clearTimeout(t);res(i)};i.onerror=()=>{clearTimeout(t);rej(new Error('image failed to load'))};i.src=src});

async function fetchPlate(){
 const sel=$('topic').value,era=$('era').value,errs=[];
 for(let n=0;n<8;n++){
  const tp=sel==='random'?pick(Object.keys(TOPICS)):sel,t=TOPICS[tp];
  const srcs=[['wikimedia commons',fromCommons]];
  if(t.loc)srcs.push(['library of congress',fromLoC]);
  if(t.met)srcs.push(['the met museum',fromMet]);
  if(PROXY&&SIQ[tp])srcs.push(['smithsonian',fromSI]);
  if(PROXY&&BHLQ[tp])srcs.push(['biodiversity heritage library',fromBHL]);
  const [name,f]=pick(srcs);
  try{const p=await f(tp,era);p.kind=tp;p.el=await loadImg(p.img);markSeen(p);return p}
  catch(e){errs.push(name+': '+(e.name==='AbortError'?'request timed out':e.message))}
 }
 const err=new Error('none');err.detail=[...new Set(errs)];throw err;
}

let hist=[],pos=-1,busy=false;
const tr=$('trace'),thumbs=new Map(),SLOTS=6;
const seen=()=>hist.slice(Math.max(0,pos-SLOTS),pos);
function updateTrace(){
 const prev=seen(),step=Math.min(80,(tr.clientWidth||480)/SLOTS),tw=step-8,th=Math.round(tw*.72);
 tr.style.height=th+'px';
 const place=(el,x,o)=>{el.style.transform='translateX('+x+'px)';el.style.opacity=o};
 prev.forEach((p,i)=>{
  const age=prev.length-1-i;
  let el=thumbs.get(p);
  if(!el){
   el=document.createElement('button');el.className='th';el.title=p.title;el.setAttribute('aria-label','revisit: '+p.title);
   const im=document.createElement('img');im.src=p.img;im.alt='';el.append(im);
   el.onclick=()=>{pos=hist.indexOf(p);render(p)};
   el.style.width=tw+'px';el.style.height=th+'px';
   place(el,SLOTS*step,0);tr.append(el);thumbs.set(p,el);el.getBoundingClientRect();
  }
  el.style.width=tw+'px';el.style.height=th+'px';
  place(el,(SLOTS-1-age)*step,Math.max(.12,.9-age*.15));
 });
 thumbs.forEach((el,p)=>{
  if(!prev.includes(p)){place(el,-step,0);setTimeout(()=>{if(!seen().includes(p)){el.remove();thumbs.delete(p)}},700)}
 });
}
addEventListener('resize',updateTrace);
function render(p){
 const fr=$('frame');fr.replaceChildren(p.el);p.el.alt=p.title;
 $('t').textContent=p.title;
 $('meta').textContent=[p.by,p.date].filter(Boolean).join(', ');
 const s=$('src');s.replaceChildren(document.createTextNode('source: '));
 const a=document.createElement('a');a.href=p.link;a.target='_blank';a.rel='noopener';a.textContent=p.source;s.append(a);
 s.append(document.createTextNode(' · '+LABEL[p.kind]+(p.rights?' · '+p.rights:'')));
 $('back').disabled=pos<=0;
 updateTrace();
}
async function go(dir){
 if(busy)return;
 if(dir<0){if(pos>0){pos--;render(hist[pos])}return}
 if(pos<hist.length-1){pos++;render(hist[pos]);return}
 busy=true;$('fig').classList.add('fade');$('next').disabled=true;
 try{const p=await fetchPlate();hist.push(p);pos=hist.length-1;render(p)}
 catch(e){const d=document.createElement('div');d.id='status';d.textContent="couldn't load a plate. "+(e.detail||[e.message]).join(' | ');$('frame').replaceChildren(d)}
 busy=false;$('fig').classList.remove('fade');$('next').disabled=false;
}
$('next').onclick=()=>go(1);$('back').onclick=()=>go(-1);
['topic','era'].forEach(id=>$(id).onchange=()=>{hist=[];pos=-1;updateTrace();go(1)});
addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(1)}if(e.key==='ArrowLeft')go(-1)});
go(1);
</script>
</body>
</html>
